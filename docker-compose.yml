name: oak-fabric
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: oak_fabric
      POSTGRES_USER: oak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oak -d oak_fabric"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
